<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Paski ocieplenia · Klimat Polski</title>
    <style>
      :root {
        --ink: #1f1e1c;
        --muted: #74726c;
        --surface: #fcfcfb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #ecebe6;
          --muted: #9b9990;
          --surface: #1a1a19;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--surface);
        color: var(--ink);
        font: 14px/1.3 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      a {
        display: flex;
        flex-direction: column;
        height: 100%;
        color: inherit;
        text-decoration: none;
      }
      #stripes {
        flex: 1;
        display: flex;
        min-height: 40px;
      }
      #stripes span {
        flex: 1;
      }
      .cap {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 10px;
      }
      .cap span:last-child {
        color: var(--muted);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <a id="link" target="_blank" rel="noopener">
      <div id="stripes" role="img"></div>
      <div class="cap"><span id="title"></span><span>Klimat Polski ↗</span></div>
    </a>
    <script type="module" src="/src/embed.ts"></script>
  </body>
</html>
